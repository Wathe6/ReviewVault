spring:
  config:
    activate:
      on-profile: test
  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://localhost:5432/media_db
    username: media_user
    password: media_pass

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  cloud:
    discovery:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
    producer:
      key-serializer: "${KAFKA_KEY_SERIALIZER}"
      value-serializer: "${KAFKA_VALUE_SERIALIZER}"
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

test:
  topic: embedded-test-topic