spring:
  application:
    name: ${SPRING_APPLICATION_NAME:media}

  config:
    import:
      - classpath:reviewvault/config/reviewvault-common.yaml
      - classpath:reviewvault/config/reviewvault-postgres.yaml
      - classpath:reviewvault/config/reviewvault-kafka.yaml
      - classpath:reviewvault/config/reviewvault-eureka.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_db}
    username: ${SPRING_DATASOURCE_USERNAME:media_user}
    password: ${SPRING_DATASOURCE_PASSWORD:media_pass}

  flyway:
    schemas: public, media

  jpa:
    properties:
      hibernate:
        default_schema: media

app:
  kafka:
    topics:
      media-item-events: ${KAFKA_TOPIC_MEDIA_ITEM_EVENTS:reviewvault.media-item-events.v1}