spring:
  application:
    name: ${SPRING_APPLICATION_NAME:library}

  config:
    import:
      - classpath:reviewvault/config/reviewvault-common.yaml
      - classpath:reviewvault/config/reviewvault-postgres.yaml
      - classpath:reviewvault/config/reviewvault-kafka.yaml
      - classpath:reviewvault/config/reviewvault-keycloak.yaml
      - classpath:reviewvault/config/reviewvault-eureka.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${SPRING_DATASOURCE_USERNAME:library_user}
    password: ${SPRING_DATASOURCE_PASSWORD:library_pass}

  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
    schemas: public, library
    placeholders:
      replicaSchema: library

  jpa:
    properties:
      hibernate:
        default_schema: library

  kafka:
    consumers:
      media-item-consumer:
        group-id: library-media-item-v1
      media-group-consumer:
        group-id: library-media-group-v1
      user-profile-consumer:
        group-id: library-user-profile-v1

app:
  kafka:
    topics:
      media-item-events: ${KAFKA_TOPIC_MEDIA_ITEM_EVENTS:reviewvault.media-item-events.v1}
      media-group-events: ${KAFKA_TOPIC_MEDIA_GROUP_EVENTS:reviewvault.media-group-events.v1}
      user-profile-events: ${KAFKA_TOPIC_USER_PROFILE_EVENTS:reviewvault.user-profile-events.v1}