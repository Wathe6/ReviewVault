spring:
  application:
    name: gateway

  web:
    resources:
      add-mappings: false

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
#            - id: hello-service
#              uri: lb://hello-service
#              predicates:
#                - Path=/hello/**
#              filters:
#                - AddRequestHeader=X-Source-Service, gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    loggers:
      enabled: true

logging:
  level:
    root: WARN
    io.envoi: INFO


server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

