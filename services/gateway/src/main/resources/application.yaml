spring:
  application:
    name: ${SPRING_APPLICATION_NAME:gateway}
  config:
    import:
    - classpath:reviewvault/config/reviewvault-common.yaml
    - classpath:reviewvault/config/reviewvault-keycloak.yaml
    - classpath:reviewvault/config/reviewvault-eureka.yaml

  web:
    resources:
      add-mappings: false

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
            - id: media
              uri: lb://media
              predicates:
                - Path=/api/v1/items/**, /api/v1/groups/**
              filters:
                - AddRequestHeader=X-Source-Service, gateway
            - id: review
              uri: lb://review
              predicates:
                - Path=/api/v1/reviews/**
              filters:
                - AddRequestHeader=X-Source-Service, gateway
            - id: profile
              uri: lb://profile
              predicates:
                - Path=/api/v1/profiles/**
              filters:
                - AddRequestHeader=X-Source-Service, gateway
            - id: library
              uri: lb://library
              predicates:
                - Path=/api/v1/libraries/**
              filters:
                - AddRequestHeader=X-Source-Service, gateway

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"