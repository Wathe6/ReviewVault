spring:
  application:
    name: ${SPRING_APPLICATION_NAME:gateway}

  web:
    resources:
      add-mappings: false

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
            - id: media
              uri: lb://media
              predicates:
                - Path=/api/v1/items/**, /api/v1/groups/**
              filters:
                - AddRequestHeader=X-Source-Service, gateway
            - id: review
              uri: lb://review
              predicates:
                - Path=/api/v1/**
              filters:
                - AddRequestHeader=X-Source-Service, gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/${KEYCLOAK_REALM}
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
    loggers:
      enabled: true



logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  level:
    root: WARN
    io.envoi: INFO
