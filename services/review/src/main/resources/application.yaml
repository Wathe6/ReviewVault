spring:
  application:
    name: ${SPRING_APPLICATION_NAME:review}

  config:
    import:
      - classpath:reviewvault/config/reviewvault-common.yaml
      - classpath:reviewvault/config/reviewvault-postgres.yaml
      - classpath:reviewvault/config/reviewvault-kafka.yaml
      - classpath:reviewvault/config/reviewvault-eureka.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/review_db}
    username: ${SPRING_DATASOURCE_USERNAME:review_user}
    password: ${SPRING_DATASOURCE_PASSWORD:review_pass}

  jpa:
    properties:
      hibernate:
        default_schema: review

  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
    schemas: public, review
    placeholders:
      replicaSchema: review

  kafka:
    consumers:
      media-item-consumer:
        group-id: review-media-item-v1
      media-group-consumer:
        group-id: review-media-group-v1
      user-profile-consumer:
        group-id: review-user-profile-v1

app:
  kafka:
    topics:
      media-item-events: ${KAFKA_TOPIC_MEDIA_ITEM_EVENTS:reviewvault.media-item-events.v1}
      media-group-events: ${KAFKA_TOPIC_MEDIA_GROUP_EVENTS:reviewvault.media-group-events.v1}
      user-profile-events: ${KAFKA_TOPIC_USER_PROFILE_EVENTS:reviewvault.user-profile-events.v1}
