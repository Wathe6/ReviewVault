spring:
  application:
    name: ${SPRING_APPLICATION_NAME:review}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/review_db}
    username: ${SPRING_DATASOURCE_USERNAME:review_user}
    password: ${SPRING_DATASOURCE_PASSWORD:review_pass}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    create-schemas: true
    default-schema: public
    schemas: public, review
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
    consumer:
      group-id: reviews-media-item-v1
      auto-offset-reset: earliest
      key-deserializer: "${KAFKA_KEY_DESERIALIZER}"
      value-deserializer: "${KAFKA_VALUE_DESERIALIZER}"
      properties:
        spring.json.trusted.packages: io.envoi.contracts.media.v1
        spring.json.use.type.headers: false
        spring.json.value.default.type: tools.jackson.databind.JsonNode

app:
  kafka:
    topics:
      media-item-events: ${KAFKA_TOPIC_MEDIA_ITEM_EVENTS:reviewvault.media-item-events.v1}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
    loggers:
      enabled: true

logging:
  level:
    root: WARN
    io.envoi: INFO